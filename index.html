<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EKO Festival 2026 – QR Hunt</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17382d;background:#f4f2e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fffdf5 0,#f4f2e8 55%,#e9eee5 100%)}.wrap{max-width:560px;margin:auto;padding:28px 18px 42px}.card{background:rgba(255,255,255,.96);border:1px solid #dce5dc;border-radius:28px;padding:30px 26px;box-shadow:0 16px 50px rgba(23,56,45,.10)}.badge{display:inline-flex;align-items:center;gap:7px;background:#e7f0e5;color:#285c46;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{margin:16px 0 10px;font-size:34px;line-height:1.08;letter-spacing:-.03em}h1 span{color:#4c8063}p{line-height:1.55;color:#5e6f66;margin:10px 0}input,button{width:100%;min-height:52px;border-radius:15px;font-size:16px}input{border:1px solid #cbd8cf;padding:13px 15px;margin:16px 0 10px;background:#fbfcf9;outline:none}button{border:0;background:#17382d;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 7px 18px rgba(23,56,45,.16);margin-top:10px}button:disabled{opacity:.6;cursor:not-allowed}.status{margin:20px 0 14px;padding:17px;border-radius:17px;background:#edf4ed;border:1px solid #dce8dc;color:#234d3b}.score{font-size:22px}.small{font-size:13px;color:#77857e}.success{font-size:18px;font-weight:800}.leaf{font-size:42px;line-height:1}.progress{height:10px;background:#e3e9e3;border-radius:99px;overflow:hidden;margin:14px 0 6px}.progress>div{height:100%;background:#4c8063;border-radius:99px}.question{font-size:20px;font-weight:800;line-height:1.35;margin:20px 0}.options{display:grid;gap:10px;margin:16px 0}.option{display:flex;align-items:flex-start;gap:11px;border:1px solid #d7e1d9;border-radius:15px;padding:14px;background:#fbfcf9;cursor:pointer;line-height:1.4}.option input{width:20px;min-height:20px;margin:1px 0 0;accent-color:#4c8063}.feedback{margin-top:18px;padding:16px;border-radius:17px}.correct{background:#e9f5eb;border:1px solid #c9e1ce}.wrong{background:#f8ece9;border:1px solid #ead1ca}.fact{margin-top:8px}.footer{margin-top:18px;text-align:center;font-size:12px;color:#89958f}</style></head><body><div class="wrap"><div class="card"><div id="app"></div></div><div class="footer">EKO Festival 2026 · QR Hunt 🌿</div></div><script>const SUPABASE_URL="https://qmmidefgdflbgbihhdah.supabase.co",SUPABASE_ANON_KEY="sb_publishable_4OOU5jtcv3niED36n8j3ag_kB8b4t6Y",TOTAL=10,app=document.getElementById("app");const QUESTIONS={1:{q:"Který organismus se často používá jako bioindikátor kvality ovzduší?",o:["Pampeliška","Lišejník","Kapradina","Jetel"],a:1,f:"Lišejníky jsou citlivé na některé látky znečišťující ovzduší, protože přijímají vodu a živiny přímo z okolního prostředí."},2:{q:"Která část stromu je hlavním místem fotosyntézy?",o:["Kořeny","Kůra","Listy","Dřevo"],a:2,f:"V listech se nachází chlorofyl, který zachycuje světelnou energii a umožňuje rostlině vytvářet organické látky."},3:{q:"Proč mají některé rostliny na povrchu listů voskovou vrstvu?",o:["Aby přitahovaly opylovače","Aby omezily ztrátu vody","Aby zvýšily příjem oxidu uhličitého","Aby urychlily růst kořenů"],a:1,f:"Vosková vrstva, tedy kutikula, funguje jako ochranná bariéra a pomáhá rostlině omezovat ztrátu vody."},4:{q:"Která z těchto rostlin dokáže díky symbióze s bakteriemi získávat dusík z atmosféry?",o:["Slunečnice","Pampeliška","Jetel","Kopřiva"],a:2,f:"Bakterie žijící v hlízkách na kořenech bobovitých rostlin vážou atmosférický dusík do formy, kterou rostlina dokáže využít."},5:{q:"Co se obvykle stane s fotosyntézou, když rostlina dlouhodobě nemá dostatek světla?",o:["Výrazně se zpomalí","Zrychlí se","Rostlina začne fotosyntetizovat v kořenech","Nemá to žádný vliv"],a:0,f:"Bez dostatku světelné energie fotosyntéza neprobíhá efektivně. Rostliny v dlouhodobém šeru mohou vytvářet bledé a vytáhlé výhony."},6:{q:"Co patří mezi nejsilnější dlouhodobé faktory spojené s psychickou pohodou?",o:["Neustálá produktivita","Kvalitní sociální vztahy","Vyhýbání se všem negativním emocím","Co nejčastější používání sociálních sítí"],a:1,f:"Výzkumy wellbeing opakovaně spojují s kvalitou mezilidských vztahů. Důležitější než počet kontaktů bývá blízkost, podpora a důvěra."},7:{q:"Proč může pobyt v přírodě pozitivně působit na psychickou pohodu?",o:["Protože automaticky zvyšuje hladinu adrenalinu","Protože nahrazuje potřebu spánku","Může pomáhat snižovat stres a podporovat regeneraci","Protože člověk v přírodě vždy spálí více kalorií"],a:2,f:"Kontakt s přírodou je spojován například s nižší mírou vnímaného stresu a lepší psychickou regenerací. Nemusí jít ani o dlouhý výlet."},8:{q:"Která situace je nejlepší příklad mindfulness?",o:["Jíst oběd a současně scrollovat sociální sítě","Při chůzi přemýšlet, co všechno ještě musíš stihnout","Při pití kávy vědomě vnímat její chuť, vůni a vlastní pocity","Snažit se během dne nemyslet na problémy"],a:2,f:"Mindfulness neznamená nemít žádné myšlenky. Jde o vědomé zaměření pozornosti na přítomný okamžik bez okamžitého hodnocení."},9:{q:"Která změna jídelníčku může mít obecně největší vliv na jeho uhlíkovou stopu?",o:["Kupovat potraviny pouze v papírových obalech","Omezit spotřebu potravin živočišného původu","Jíst pouze bio potraviny","Kupovat výhradně potraviny vypěstované do 50 km od domova"],a:1,f:"Produkce různých potravin má velmi rozdílnou environmentální stopu. U mnoha živočišných produktů, zejména hovězího masa, bývá výrazně vyšší než u většiny rostlinných potravin."},10:{q:"Který způsob péče o trávník může být z hlediska biodiverzity nejpříznivější?",o:["Sekat ho velmi často a udržovat ho velmi nízký","Používat pravidelně pesticidy proti plevelům","Nechat část trávníku růst déle a podporovat různé druhy rostlin","Vysadit pouze jeden druh trávy"],a:2,f:"Pestřejší a méně intenzivně sečené plochy poskytují potravu a úkryt mnoha druhům hmyzu. I částečně nechaný pás může mít ekologický význam."}};function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function getPlayer(){return localStorage.getItem("qrhunt_player")}function setPlayer(v){localStorage.setItem("qrhunt_player",v)}function getAttempted(){try{return new Set(JSON.parse(localStorage.getItem("qrhunt_attempted")||"[]").map(Number))}catch{return new Set()}}function saveAttempted(s){localStorage.setItem("qrhunt_attempted",JSON.stringify([...s]))}async function api(path,options={}){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{...options,headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json",Prefer:"return=representation",...(options.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()}function rewardBox(found,points){const eligible=points>=7||found===TOTAL;return `<div class="status" style="margin-top:12px;background:${eligible?'#e9f5eb':'#f5f6f2'};border-color:${eligible?'#c9e1ce':'#dce3da'}"><div style="font-size:17px;font-weight:800">${eligible?'🎁 Máš nárok na odměnu!':'🎁 Jak získat odměnu?'}</div><p style="margin:8px 0 0;color:#5e6f66">${eligible?'Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a podle toho, co si vytočíš, získáš odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>':'Stačí získat alespoň <strong>7 bodů z 10</strong> nebo najít všech <strong>10 QR kódů</strong>. Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a podle toho, co si vytočíš, získáš odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>'}</p></div>`}function scoreBox(found,points){return `<div class="status"><div class="score"><strong>${found} / ${TOTAL}</strong> QR kódů</div><div class="progress"><div style="width:${found/TOTAL*100}%"></div></div><div class="small">⭐ ${points} bodů</div></div>${rewardBox(found,points)}`}async function getRows(player){return api("scans?player=eq."+encodeURIComponent(player)+"&select=qr_id")}function calc(rows,attempted){const points=new Set(rows.map(x=>Number(x.qr_id)));points.forEach(x=>attempted.add(Math.abs(x)));return{found:attempted.size,points:[...points].filter(x=>x>0).length}}async function render(){const qr=Number(new URLSearchParams(location.search).get("qr")||0),player=getPlayer();if(!player){app.innerHTML=`<div class="leaf">🌿</div><div class="badge">EKO Festival 2026</div><h1>EKO <span>QR Hunt</span></h1><p>Najdi všech <strong>10 ukrytých QR kódů</strong>. Po načtení každého tě čeká krátká otázka.</p><input id="name" maxlength="40" placeholder="Tvoje přezdívka nebo jméno"><button id="start">Začít lov 🌱</button><p class="small">Bez aplikace. Stačí telefon a fotoaparát.</p>`;document.getElementById("start").onclick=()=>{const n=document.getElementById("name").value.trim();if(n.length<2)return alert("Zadej prosím alespoň 2 znaky.");setPlayer(n);render()};return}const attempted=getAttempted();try{const rows=await getRows(player);rows.forEach(x=>attempted.add(Math.abs(Number(x.qr_id))));saveAttempted(attempted);if(!qr){const s=calc(rows,attempted);app.innerHTML=`<div class="badge">EKO Festival 2026</div><h1>Tvůj <span>QR Hunt</span></h1><p>Ahoj, <strong>${esc(player)}</strong>! 👋</p>${scoreBox(s.found,s.points)}<p>${s.found===TOTAL?"🎉 Máš kompletní lov! Ukaž svůj výsledek na stánku a vyzvedni si odměnu.":s.points>=7?"🎉 Máš 7 nebo více bodů! Ukaž svůj výsledek na stánku a vyzvedni si odměnu.":"Hledání pokračuje! Najdi další QR kód a odpověz na otázku."}</p>`;return}if(qr<1||qr>TOTAL){app.innerHTML=`<div class="leaf">🌱</div><h1>Neplatné stanoviště</h1><p>Tento QR kód není součástí EKO QR Huntu.</p>`;return}if(attempted.has(qr)){const s=calc(rows,attempted);app.innerHTML=`<div class="leaf">✓</div><div class="badge">Stanoviště ${qr}</div><h1>Už <span>splněno</span></h1><p>Toto stanoviště už jsi navštívil/a. Hledej další QR kód!</p>${scoreBox(s.found,s.points)}<button onclick="location.href='./'">Zpět na skóre</button>`;return}const item=QUESTIONS[qr];app.innerHTML=`<div class="badge">Stanoviště ${qr} z ${TOTAL}</div><h1>🌿 <span>Otázka</span></h1><div class="question">${esc(item.q)}</div><form id="quiz"><div class="options">${item.o.map((x,i)=>`<label class="option"><input type="radio" name="answer" value="${i}"><span><strong>${String.fromCharCode(65+i)})</strong> ${esc(x)}</span></label>`).join("")}</div><button id="submit" type="submit">Odpovědět</button></form>`;document.getElementById("quiz").onsubmit=async e=>{e.preventDefault();const selected=document.querySelector('input[name="answer"]:checked');if(!selected)return alert("Vyber prosím jednu odpověď.");document.getElementById("submit").disabled=true;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=true);const correct=Number(selected.value)===item.a;attempted.add(qr);saveAttempted(attempted);try{await api("scans",{method:"POST",body:JSON.stringify({player,qr_id:correct?qr:-qr})});const all=await getRows(player),s=calc(all,attempted);app.innerHTML=`<div class="leaf">${correct?"🎉":"🌱"}</div><div class="badge">Stanoviště ${qr}</div><h1>${correct?"Správně!":"Tentokrát ne."}</h1><div class="feedback ${correct?"correct":"wrong"}"><strong>${correct?"+1 bod!":"0 bodů za toto stanoviště."}</strong><div class="fact">Správná odpověď: <strong>${String.fromCharCode(65+item.a)}) ${esc(item.o[item.a])}</strong><br>💡 ${esc(item.f)}</div></div>${scoreBox(s.found,s.points)}<p>${correct?"Skvěle! Hledej další QR kód.":"QR kód je splněný, ale bod za něj už získat nelze."}</p><button onclick="location.href='./'">Moje skóre</button>`}catch(err){attempted.delete(qr);saveAttempted(attempted);document.getElementById("submit").disabled=false;document.querySelectorAll('input[name="answer"]').forEach(x=>x.disabled=false);alert("Výsledek se nepodařilo uložit. Zkus to prosím znovu.")}}}catch(e){app.innerHTML=`<div class="leaf">⚠️</div><h1>Něco se pokazilo</h1><p>Stanoviště se nepodařilo načíst. Zkus stránku načíst znovu.</p>`}}render();</script></body></html>
