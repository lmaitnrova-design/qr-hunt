<!doctype html><html lang=cs><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>EKO Festival 2026 – QR Hunt</title><style>body{margin:0;background:#f4f2e8;color:#17382d;font:16px system-ui}.w{max-width:560px;margin:auto;padding:28px 18px}.c{background:#fff;border:1px solid #dce5dc;border-radius:28px;padding:28px;box-shadow:0 16px 50px #17382d18}h1{font-size:34px;margin:16px 0 10px}h1 b{color:#4c8063}p{line-height:1.55;color:#5e6f66}.badge{display:inline-block;background:#e7f0e5;color:#285c46;border-radius:99px;padding:8px 12px;font-size:12px;font-weight:800;text-transform:uppercase}.status{margin:18px 0;padding:17px;border-radius:17px;background:#edf4ed;border:1px solid #dce8dc}.bar{height:10px;background:#e3e9e3;border-radius:99px;overflow:hidden;margin:14px 0 6px}.bar i{display:block;height:100%;background:#4c8063}.q{font-size:20px;font-weight:800;line-height:1.35;margin:20px 0}.opts{display:grid;gap:10px}.opt{display:flex;gap:10px;border:1px solid #d7e1d9;border-radius:15px;padding:14px;background:#fbfcf9;cursor:pointer}.opt input{width:20px}.fb{margin-top:18px;padding:16px;border-radius:17px}.ok{background:#e9f5eb;border:1px solid #c9e1ce}.bad{background:#f8ece9;border:1px solid #ead1ca}button,input{width:100%;min-height:52px;border-radius:15px;font-size:16px}button{border:0;background:#17382d;color:#fff;font-weight:800;margin-top:12px;cursor:pointer}input{border:1px solid #cbd8cf;padding:13px;margin:16px 0 10px;box-sizing:border-box}</style><div class=w><div class=c id=a></div><p style="text-align:center;font-size:12px">EKO Festival 2026 · QR Hunt 🌿</p></div><script>const U='https://qmmidefgdflbgbihhdah.supabase.co',K='sb_publishable_4OOU5jtcv3niED36n8j3ag_kB8b4t6Y',N=10,A=document.getElementById('a'),Q={1:['Který organismus se často používá jako bioindikátor kvality ovzduší?',['Pampeliška','Lišejník','Kapradina','Jetel'],1,'Lišejníky jsou citlivé na některé látky znečišťující ovzduší, protože přijímají vodu a živiny přímo z okolí.'],2:['Která část stromu je hlavním místem fotosyntézy?',['Kořeny','Kůra','Listy','Dřevo'],2,'V listech je chlorofyl, který zachycuje světelnou energii pro fotosyntézu.'],3:['Proč mají některé rostliny na povrchu listů voskovou vrstvu?',['Aby přitahovaly opylovače','Aby omezily ztrátu vody','Aby zvýšily příjem oxidu uhličitého','Aby urychlily růst kořenů'],1,'Vosková vrstva neboli kutikula funguje jako ochranná bariéra a omezuje ztrátu vody.'],4:['Která z těchto rostlin dokáže díky symbióze s bakteriemi získávat dusík z atmosféry?',['Slunečnice','Pampeliška','Jetel','Kopřiva'],2,'Bakterie v kořenových hlízkách bobovitých rostlin vážou atmosférický dusík do využitelné formy.'],5:['Co se obvykle stane s fotosyntézou, když rostlina dlouhodobě nemá dostatek světla?',['Výrazně se zpomalí','Zrychlí se','Rostlina začne fotosyntetizovat v kořenech','Nemá to žádný vliv'],0,'Bez dostatku světelné energie fotosyntéza neprobíhá efektivně.'],6:['Co patří mezi nejsilnější dlouhodobé faktory spojené s psychickou pohodou?',['Neustálá produktivita','Kvalitní sociální vztahy','Vyhýbání se všem negativním emocím','Co nejčastější používání sociálních sítí'],1,'Wellbeing je dlouhodobě silně spojen s kvalitou mezilidských vztahů, podporou a důvěrou.'],7:['Proč může pobyt v přírodě pozitivně působit na psychickou pohodu?',['Protože automaticky zvyšuje adrenalin','Protože nahrazuje spánek','Může pomáhat snižovat stres a podporovat regeneraci','Protože člověk v přírodě vždy spálí více kalorií'],2,'Kontakt s přírodou může pomáhat snižovat vnímaný stres a podporovat psychickou regeneraci.'],8:['Která situace je nejlepší příklad mindfulness?',['Jíst oběd a scrollovat sociální sítě','Při chůzi řešit, co ještě musíš stihnout','Při pití kávy vědomě vnímat chuť, vůni a vlastní pocity','Snažit se nemyslet na problémy'],2,'Mindfulness znamená vědomě zaměřit pozornost na přítomný okamžik bez okamžitého hodnocení.'],9:['Která změna jídelníčku může mít obecně největší vliv na jeho uhlíkovou stopu?',['Kupovat jen papírové obaly','Omezit spotřebu potravin živočišného původu','Jíst pouze bio potraviny','Kupovat jen potraviny do 50 km od domova'],1,'Produkce potravin má různou environmentální stopu; u mnoha živočišných produktů bývá vyšší než u rostlinných.'],10:['Který způsob péče o trávník může být z hlediska biodiverzity nejpříznivější?',['Sekat ho velmi často a nízko','Používat pesticidy proti plevelům','Nechat část trávníku růst déle a podporovat různé druhy rostlin','Vysadit pouze jeden druh trávy'],2,'Pestřejší a méně intenzivně sečené plochy poskytují potravu a úkryt mnoha druhům hmyzu.']};const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x])),getP=()=>localStorage.qrhP,setP=x=>localStorage.qrhP=x,getA=()=>new Set(JSON.parse(localStorage.qrhA||'[]').map(Number)),saveA=s=>localStorage.qrhA=JSON.stringify([...s]);async function api(path,opt={}){let r=await fetch(U+'/rest/v1/'+path,{...opt,headers:{apikey:K,Authorization:'Bearer '+K,'Content-Type':'application/json',Prefer:'return=representation',...(opt.headers||{})}});if(!r.ok)throw Error(await r.text());return r.status==204?[]:r.json()}function reward(f,p){let e=p>=7||f==N;return `<div class=status><b>${e?'🎁 Máš nárok na odměnu!':'🎁 Jak získat odměnu?'}</b><p>${e?'Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a podle toho, co si vytočíš, získáš odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>':'Stačí získat alespoň <strong>7 bodů z 10</strong> nebo najít všech <strong>10 QR kódů</strong>. Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a podle toho, co si vytočíš, získáš odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>'}</p></div>`}async function rows(p){return api('scans?player=eq.'+encodeURIComponent(p)+'&select=qr_id')}async function render(){let qr=+new URLSearchParams(location.search).get('qr')||0,p=getP();if(!p){A.innerHTML='<div class=badge>EKO Festival 2026</div><h1>EKO <b>QR Hunt</b></h1><p>Najdi všech <strong>10 ukrytých QR kódů</strong>. Po načtení každého tě čeká krátká otázka.</p><input id=n maxlength=40 placeholder="Tvoje přezdívka nebo jméno"><button onclick="let x=n.value.trim();if(x.length<2)return alert(\'Zadej prosím alespoň 2 znaky.\');setP(x);render()">Začít lov 🌱</button><p>Bez aplikace. Stačí telefon a fotoaparát.</p>';return}let at=getA();try{let rs=await rows(p);rs.forEach(x=>at.add(Math.abs(+x.qr_id)));saveA(at);let pts=new Set(rs.map(x=>+x.qr_id)).size;if(!qr){let f=at.size;A.innerHTML=`<div class=badge>EKO Festival 2026</div><h1>Tvůj <b>QR Hunt</b></h1><p>Ahoj, <strong>${esc(p)}</strong>! 👋</p><div class=status><b style="font-size:22px">${f} / ${N}</b> QR kódů<div class=bar><i style="width:${f/N*100}%"></i></div>⭐ ${pts} bodů</div>${reward(f,pts)}<p>${f==N||pts>=7?'🎉 Máš nárok na odměnu!':'Hledání pokračuje! Najdi další QR kód a odpověz na otázku.'}</p>`;return}if(!Q[qr])return A.innerHTML='<h1>Neplatné stanoviště</h1>';if(at.has(qr))return A.innerHTML='<div class=badge>Stanoviště '+qr+'</div><h1>✓ Už <b>splněno</b></h1><p>Toto stanoviště už jsi navštívil/a. Hledej další QR kód!</p><button onclick="location.href=\'./\'">Zpět na skóre</button>';let x=Q[qr];A.innerHTML=`<div class=badge>Stanoviště ${qr} z ${N}</div><div class=q>${esc(x[0])}</div><div class=opts>${x[1].map((o,i)=>`<label class=opt><input type=radio name=r value=${i}><span><b>${String.fromCharCode(65+i)})</b> ${esc(o)}</span></label>`).join('')}</div><button id=s>Odpovědět</button><div id=f></div>`;s.onclick=async()=>{let z=document.querySelector('input[name=r]:checked');if(!z)return alert('Vyber prosím odpověď.');s.disabled=true;let ok=+z.value===x[2];at.add(qr);saveA(at);if(ok)try{await api('scans',{method:'POST',body:JSON.stringify({player:p,qr_id:qr})})}catch(e){at.delete(qr);saveA(at);s.disabled=false;f.innerHTML='<div class="fb bad"><b>Odpověď se nepodařila uložit.</b><p>Zkus to prosím ještě jednou.</p></div>';return}f.innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'🎉 Správně! +1 bod':'❌ Tentokrát ne. 0 bodů'}</b><p><strong>💡 Zajímavost:</strong> ${esc(x[3])}</p><button onclick="location.href='./'">Pokračovat na skóre</button></div>`}}catch(e){A.innerHTML='<h1>Něco se pokazilo</h1><p>Zkus stránku obnovit.</p>'}}render();</script>
