<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EKO Festival 2026 – Admin</title><style>:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17382d;background:#f4f2e8}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#fffdf5 0,#f4f2e8 55%,#e9eee5 100%)}.wrap{max-width:1100px;margin:auto;padding:30px 18px 50px}.head{display:flex;justify-content:space-between;gap:18px;align-items:end;margin-bottom:22px}.badge{display:inline-block;background:#e7f0e5;color:#285c46;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}h1{font-size:34px;margin:12px 0 5px;letter-spacing:-.03em}.muted{color:#66766e}.actions{display:flex;gap:10px}.btn{border:0;border-radius:13px;padding:12px 16px;background:#17382d;color:white;font-weight:800;cursor:pointer}.btn.secondary{background:#fff;color:#285c46;border:1px solid #dce5dc}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid #dce5dc;border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(23,56,45,.06)}.stat b{display:block;font-size:28px;margin-top:5px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#77857e;font-weight:800}.card{background:#fff;border:1px solid #dce5dc;border-radius:22px;overflow:hidden;box-shadow:0 12px 35px rgba(23,56,45,.08)}table{width:100%;border-collapse:collapse}th,td{padding:14px 16px;border-bottom:1px solid #e4eae5;text-align:left}th{background:#f1f5ef;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#53645c}tr:last-child td{border-bottom:0}.count{font-weight:900;font-size:16px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4ed;font-size:12px;font-weight:800}.empty{padding:30px;color:#66766e}.foot{font-size:12px;color:#87928c;margin-top:14px}.updated{font-size:12px;color:#87928c;margin-top:7px}@media(max-width:700px){.head{align-items:flex-start;flex-direction:column}.actions{width:100%}.btn{flex:1}.stats{grid-template-columns:1fr}.card{overflow:auto}table{min-width:620px}}</style></head><body><div class="wrap"><div class="head"><div><div class="badge">EKO Festival 2026 · Organizátor</div><h1>🌿 QR Hunt – admin</h1><div class="muted">Přehled účastníků a nalezených QR kódů.</div><div class="updated" id="updated">Načítám…</div></div><div class="actions"><button class="btn secondary" id="refresh">↻ Obnovit</button></div></div><div class="stats"><div class="stat"><span class="label">Účastníci</span><b id="players">–</b></div><div class="stat"><span class="label">Všechny skeny</span><b id="scans">–</b></div><div class="stat"><span class="label">Dokončeno 10/10</span><b id="complete">–</b></div></div><div class="card"><table><thead><tr><th>#</th><th>Hráč</th><th>Nalezeno</th><th>Body</th><th>Stanoviště</th></tr></thead><tbody id="rows"><tr><td colspan="5" class="empty">Načítám výsledky…</td></tr></tbody></table></div><div class="foot">10 stanovišť · 1 bod za každý QR · automatická aktualizace každých 10 sekund</div></div><script>const SUPABASE_URL="https://qmmidefgdflbgbihhdah.supabase.co",SUPABASE_ANON_KEY="sb_publishable_4OOU5jtcv3niED36n8j3ag_kB8b4t6Y";async function api(path){const r=await fetch(SUPABASE_URL+"/rest/v1/"+path,{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});if(!r.ok)throw Error(await r.text());return r.json()}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))}async function run(){try{const scans=await api("scans?select=player,qr_id,created_at&order=created_at.desc");const m={};scans.forEach(x=>{m[x.player]??=new Set();m[x.player].add(x.qr_id)});const list=Object.entries(m).sort((a,b)=>b[1].size-a[1].size||a[0].localeCompare(b[0]));document.getElementById("players").textContent=list.length;document.getElementById("scans").textContent=scans.length;document.getElementById("complete").textContent=list.filter(x=>x[1].size===10).length;const rows=list.map(([p,s],i)=>`<tr><td>${i+1}</td><td><strong>${esc(p)}</strong></td><td class="count">${s.size}/10</td><td><span class="pill">⭐ ${s.size}</span></td><td>${[...s].sort((a,b)=>a-b).join(", ")}</td></tr>`).join("");document.getElementById("rows").innerHTML=rows||'<tr><td colspan="5" class="empty">Zatím nikdo QR kód nenaskenoval.</td></tr>';document.getElementById("updated").textContent="Aktualizováno: "+new Date().toLocaleTimeString("cs-CZ")}catch(e){document.getElementById("rows").innerHTML='<tr><td colspan="5" class="empty">Výsledky se nepodařilo načíst. Zkontroluj připojení k Supabase.</td></tr>'}}document.getElementById("refresh").onclick=run;run();setInterval(run,10000)</script></body></html>
