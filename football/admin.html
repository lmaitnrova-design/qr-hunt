<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin • Fotbalový kvíz Maty Káma</title><link rel="icon" href="assets/viktoria-plzen.svg"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header class="topbar"><img src="assets/viktoria-plzen.svg" class="logo"><div class="brand"><span>ADMIN</span><strong>MATY KÁMA</strong></div></header><main class="shell"><section id="login" class="card"><p class="eyebrow">ADMINISTRACE</p><h1 style="font-family:'Barlow Condensed';font-size:48px;margin:0 0 20px">Výsledky kvízu</h1><input id="email" value="TYLMa@zs15.plzen-edu.cz" placeholder="E-mail" type="email" autocomplete="username" style="width:100%;padding:14px;border:2px solid #dce6ec;border-radius:12px;font-size:16px;margin-bottom:10px"><input id="password" placeholder="Heslo" type="password" autocomplete="current-password" style="width:100%;padding:14px;border:2px solid #dce6ec;border-radius:12px;font-size:16px"><button id="loginBtn" style="margin-top:12px;width:100%">PŘIHLÁSIT</button><div id="loginError" class="error"></div></section><section id="dashboard" class="card hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:15px"><div><p class="eyebrow">ADMINISTRACE</p><h2 style="font-family:'Barlow Condensed';font-size:42px;margin:0">Výsledky</h2></div><button id="logout" style="background:#eef2f5;color:#17425c">ODHLÁSIT</button></div><div id="stats" style="margin:22px 0;font-weight:800"></div><div style="overflow:auto"><table style="width:100%;border-collapse:collapse"><thead><tr><th style="text-align:left;padding:10px;border-bottom:2px solid #dfe8ee">Přezdívka</th><th style="padding:10px;border-bottom:2px solid #dfe8ee">Body</th><th style="padding:10px;border-bottom:2px solid #dfe8ee">Odpovědí</th><th style="text-align:left;padding:10px;border-bottom:2px solid #dfe8ee">Začátek</th></tr></thead><tbody id="results"></tbody></table></div><div id="detail" style="margin-top:25px"></div></section></main><footer>Fotbalový kvíz Maty Káma</footer><script>const U='https://qmmidefgdflbgbihhdah.supabase.co',K='sb_publishable_4OOU5jtcv3niED36n8j3ag_kB8b4t6Y',sb=supabase.createClient(U,K),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}));async function load(){const{data,error}=await sb.from('quiz_admin_results').select('*').order('started_at',{ascending:false});if(error){$('stats').textContent='Nepodařilo se načíst výsledky.';return}$('stats').textContent=`Celkem hráčů: ${data.length}`;$('results').innerHTML=data.map(r=>`<tr data-id="${r.id}" style="cursor:pointer"><td style="padding:12px 10px;border-bottom:1px solid #edf1f4;font-weight:800">${esc(r.nickname)}</td><td style="padding:12px 10px;border-bottom:1px solid #edf1f4;text-align:center">${r.score}</td><td style="padding:12px 10px;border-bottom:1px solid #edf1f4;text-align:center">${r.answered}</td><td style="padding:12px 10px;border-bottom:1px solid #edf1f4">${new Date(r.started_at).toLocaleString('cs-CZ')}</td></tr>`).join('');document.querySelectorAll('#results tr').forEach(x=>x.onclick=()=>detail(x.dataset.id))}async function detail(id){const{data,error}=await sb.from('quiz_answers').select('question_id,selected_value,correct,answered_at').eq('attempt_id',id).order('question_id');if(error)return;const{data:qs}=await sb.from('quiz_questions').select('id,order_no,question,options').order('order_no');$('detail').innerHTML='<h3 style="font-family:Barlow Condensed;font-size:30px">Detail odpovědí</h3>'+data.map(a=>{const q=qs.find(x=>x.id===a.question_id),o=typeof q.options==='string'?JSON.parse(q.options):q.options,l=o.find(x=>x.value===a.selected_value)?.label||a.selected_value;return `<div style="padding:12px 0;border-bottom:1px solid #edf1f4"><b>${q.order_no}. ${esc(q.question)}</b><div style="margin-top:5px;color:${a.correct?'#158447':'#b20f16'}">${esc(l)} — ${a.correct?'správně':'špatně'}</div></div>`}).join('')}async function init(){const{data:{session}}=await sb.auth.getSession();if(session){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load()}}$('loginBtn').onclick=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent='Přihlášení se nepodařilo.';return}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');load()};$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};init();</script></body></html>
