name: Update reward wording

on:
  push:
    paths:
      - '.github/workflows/update-reward-wording.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update wording
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old1 = 'Odměnu si můžeš vyzvednout každý den od 10:00 do 14:00 na stánku <strong>Adoptuj rostlinu</strong>. Ukaž svůj výsledek a zatoč si kolem štěstí! 🎡🌱'
          new1 = 'Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a získej odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>'
          old2 = 'Stačí získat alespoň <strong>7 bodů z 10</strong> nebo najít všech <strong>10 QR kódů</strong>. Potom si odměnu vyzvedneš každý den od 10:00 do 14:00 na stánku <strong>Adoptuj rostlinu</strong> a zatočíš si kolem štěstí! 🎡🌱'
          new2 = 'Stačí získat alespoň <strong>7 bodů z 10</strong> nebo najít všech <strong>10 QR kódů</strong>. Potom si na stánku <strong>Adoptuj rostlinu</strong> zatoč kolem štěstí a získej odměnu! 🎡🌱<br><strong>Každý den od 10:00 do 14:00.</strong>'
          if old1 not in s and old2 not in s:
              raise SystemExit('Reward wording not found')
          s = s.replace(old1, new1).replace(old2, new2)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/update-reward-wording.yml
          git commit -m 'Refine reward instructions'
          git push