name: Remove nickname change option

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove nickname change UI
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button class="change" id="reset">Změnit přezdívku</button>', '')
          s = s.replace(';document.getElementById("reset").onclick=()=>{localStorage.removeItem("qrhunt_player");localStorage.removeItem("qrhunt_attempted");render()}', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-nickname.yml
          git add index.html .github/workflows/fix-nickname.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove nickname change option"
          git push