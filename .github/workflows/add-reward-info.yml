name: Add reward eligibility info

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add reward information
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '''function scoreBox(found,points){return `<div class="status"><div class="score"><strong>${found} / ${TOTAL}</strong> QR kódů</div><div class="progress"><div style="width:${found/TOTAL*100}%"></div></div><div class="small">⭐ ${points} bodů</div></div>`}'''
          new = '''function rewardBox(found,points){const eligible=points>=7||found===TOTAL;return `<div class="status" style="margin-top:12px;background:${eligible?'#e9f5eb':'#f5f6f2'};border-color:${eligible?'#c9e1ce':'#dce3da'}"><div style="font-size:17px;font-weight:800">${eligible?'🎁 Máš nárok na odměnu!':'🎁 Jak získat odměnu?'}</div><p style="margin:8px 0 0;color:#5e6f66">${eligible?'Odměnu si můžeš vyzvednout každý den od 10:00 do 14:00 na stánku <strong>Adoptuj rostlinu</strong>. Ukaž svůj výsledek a zatoč si kolem štěstí! 🎡🌱':'Stačí získat alespoň <strong>7 bodů z 10</strong> nebo najít všech <strong>10 QR kódů</strong>. Potom si odměnu vyzvedneš každý den od 10:00 do 14:00 na stánku <strong>Adoptuj rostlinu</strong> a zatočíš si kolem štěstí! 🎡🌱'}</p></div>`}function scoreBox(found,points){return `<div class="status"><div class="score"><strong>${found} / ${TOTAL}</strong> QR kódů</div><div class="progress"><div style="width:${found/TOTAL*100}%"></div></div><div class="small">⭐ ${points} bodů</div></div>${rewardBox(found,points)}`}'''
          if old not in s:
              raise SystemExit('scoreBox target not found')
          s = s.replace(old, new, 1)

          old2 = '''${s.found===TOTAL?"🎉 Máš kompletní lov! Teď už jen ukaž svůj výsledek u stánku.":"Hledání pokračuje! Najdi další QR kód a odpověz na otázku."}'''
          new2 = '''${s.found===TOTAL?"🎉 Máš kompletní lov! Ukaž svůj výsledek na stánku a vyzvedni si odměnu.":s.points>=7?"🎉 Máš 7 nebo více bodů! Ukaž svůj výsledek na stánku a vyzvedni si odměnu.":"Hledání pokračuje! Najdi další QR kód a odpověz na otázku."}'''
          if old2 not in s:
              raise SystemExit('main message target not found')
          s = s.replace(old2, new2, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove helper workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/add-reward-info.yml
          git add index.html .github/workflows/add-reward-info.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add reward eligibility info"
          git push
